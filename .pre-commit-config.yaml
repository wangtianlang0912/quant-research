# pre-commit 只做"廉价且确定"的检查，不跑全量 CI。
# 全量门禁在 .github/workflows/ci.yml；本地等价于 `make check`。

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/archive/|web/)
      - id: end-of-file-fixer
        exclude: ^(docs/archive/|web/)
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(configs/markets/.*\.template$)
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      # ★ 入库纪律：v1 有 2559 行生产脚本跑了 40 天从未提交。
      #   这里在 commit 前就拦一次，不留给 CI。
      - id: no-absolute-user-path
        name: 禁止他人机器绝对路径（ARCH004）
        language: system
        entry: python -m tools.arch_lint.cli --root . --only ARCH004
        pass_filenames: false
        types: [text]

      - id: mypy
        name: mypy --strict（核心域）
        language: system
        entry: uv run mypy
        pass_filenames: false
        types: [python]
