<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Research Dashboard</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card2: #21253a;
  --border: #2a2d3e;
  --accent: #6366f1;
  --accent2: #22d3ee;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
.header .subtitle { font-size: 13px; color: var(--text3); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.badge { background: var(--accent); color: white; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
.badge-green { background: var(--green); }
.badge-red { background: var(--red); }

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: calc(100vh - 56px);
}
.sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.main { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.card-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.card-body { padding: 12px 16px; }

/* ── Symbol list ── */
.symbol-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.symbol-item:hover { background: var(--card2); }
.symbol-item.active { background: var(--card2); border: 1px solid var(--accent); }
.symbol-item .sym { font-size: 13px; font-weight: 600; color: var(--text); }
.symbol-item .info { font-size: 11px; color: var(--text3); margin-top: 2px; }
.symbol-item .rows { font-size: 11px; color: var(--text3); }

/* ── K-line chart (Lightweight Charts) ── */
.chart-container { position: relative; height: 360px; }
#klineChart { width: 100%; height: 100%; }
/* MA legend badges */
#maLegend { display: flex; gap: 12px; margin-top: 8px; justify-content: flex-end; }
#maLegend span { font-size: 12px; font-weight: 600; font-family: monospace; }

/* ── Param panel ── */
.param-group { margin-bottom: 16px; }
.param-group label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 8px;
  font-weight: 500;
}
.param-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.param-row label { min-width: 80px; font-size: 12px; color: var(--text3); }
.param-row input[type=range] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}
.param-row input[type=number] {
  width: 70px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 13px;
  text-align: center;
}
.param-value {
  min-width: 50px;
  text-align: right;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent2);
  font-variant-numeric: tabular-nums;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  width: 100%;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #4f46e5; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--card2); color: var(--text); }
.btn-scan { background: var(--green); color: white; }
.btn-scan:hover { background: #059669; }

/* ── Metrics grid ── */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border-radius: 0 0 10px 10px;
  overflow: hidden;
}
.metric {
  background: var(--card);
  padding: 14px 16px;
  text-align: center;
}
.metric .val {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.metric .val.green { color: var(--green); }
.metric .val.red { color: var(--red); }
.metric .lbl {
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Equity curve ── */
#equityChart { width: 100% !important; }

/* ── Comparison table ── */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 1px solid var(--border); }
th {
  padding: 8px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--card2); }
td .mono { font-variant-numeric: tabular-nums; font-size: 12px; }
td .tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  background: var(--card2);
  color: var(--text2);
}
td .tag.tf { background: rgba(99,102,241,0.2); color: var(--accent); }
td .tag.mr { background: rgba(34,211,238,0.15); color: var(--accent2); }
.sharpe { font-weight: 700; }
.sharpe.high { color: var(--green); }
.sharpe.low { color: var(--red); }

/* ── Heatmap ── */
.scan-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.scan-card {
  background: var(--card2);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.scan-card:hover { border-color: var(--accent); }
.scan-card.best { border-color: var(--green); background: rgba(16,185,129,0.08); }
.scan-card .params { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.scan-card .metrics { display: flex; gap: 10px; flex-wrap: wrap; }
.scan-card .m { font-size: 12px; }
.scan-card .m .v { font-weight: 700; }
.scan-card .m .v.g { color: var(--green); }
.scan-card .m .m .v.r { color: var(--red); }

/* ── Strategy tabs ── */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; }
.tab {
  flex: 1;
  padding: 8px;
  text-align: center;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: var(--card2);
  color: var(--text3);
  border: 1px solid transparent;
  transition: all 0.15s;
}
.tab.active { background: rgba(99,102,241,0.2); color: var(--accent); border-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }

/* ── Loading spinner ── */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Alert ── */
.alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 8px; }
.alert-error { background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); }
.alert-success { background: rgba(16,185,129,0.1); border: 1px solid var(--green); color: var(--green); }

/* ── Two-col grid ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ── 荐股日历 ── */
.picks-day { margin-bottom: 14px; }
.picks-date { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.3px; }
.picks-items { display: flex; flex-direction: column; gap: 6px; }
.picks-item {
  background: var(--card2);
  border-radius: 8px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent);
}
.picks-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.picks-name { font-size: 13px; font-weight: 600; color: var(--text); }
.picks-score { font-size: 12px; font-weight: 700; }
.picks-item-detail { font-size: 11px; color: var(--text2); display: flex; gap: 8px; }
.picks-item-returns { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M3 17l6-6 4 4 8-10" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 7h7v7" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Quant Research</h1>
  <span class="subtitle">回测 · 参数调优 · 可视化</span>
  <div class="header-right">
    <span class="badge badge-green" id="statusBadge">就绪</span>
  </div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- ── Left Sidebar ── -->
  <div class="sidebar">

    <!-- 数据标的 -->
    <div class="card">
      <div class="card-header"><div class="dot"></div>数据标的</div>
      <div class="card-body" style="padding:8px;">
        <div id="symbolList"><div style="color:var(--text3);font-size:12px;padding:8px;">加载中...</div></div>
      </div>
    </div>

    <!-- 策略选择 -->
    <div class="card">
      <div class="card-header"><div class="dot"></div>策略</div>
      <div class="card-body">
        <div class="tabs">
          <div class="tab active" data-strategy="trend_following">趋势跟随</div>
          <div class="tab" data-strategy="mean_reversion">均值回归</div>
        </div>
        <div id="paramPanel">
          <!-- 动态填充 -->
        </div>
        <div style="margin-top:12px; display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-primary" id="btnRun">▶ 运行回测</button>
          <button class="btn btn-scan" id="btnScan">⚡ 参数扫描</button>
        </div>
        <div id="runAlert"></div>
      </div>
    </div>

    <!-- 回测参数 -->
    <div class="card">
      <div class="card-header"><div class="dot"></div>风控参数</div>
      <div class="card-body">
        <div id="riskParams">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>

    <!-- 快速参数预设 -->
    <div class="card">
      <div class="card-header"><div class="dot"></div>快速预设</div>
      <div class="card-body" style="padding:8px;">
        <div id="presets" style="display:flex;flex-direction:column;gap:4px;"></div>
      </div>
    </div>

  </div>

  <!-- ── Main Content ── -->
  <div class="main">

    <!-- 行情 K 线 -->
    <div class="card">
      <div class="card-header">
        <div class="dot"></div>
        <span id="chartTitle">沪深300 日线</span>
        <span style="margin-left:auto;font-size:11px;color:var(--text3)" id="chartRange"></span>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <div id="klineChart"></div>
        </div>
        <div id="maLegend">
          <span style="color:#6366f1">MA5</span>
          <span style="color:#22d3ee">MA20</span>
          <span style="color:#f59e0b">MA60</span>
        </div>
      </div>
    </div>

    <!-- 回测结果 -->
    <div class="card" id="resultsCard" style="display:none;">
      <div class="card-header"><div class="dot"></div>回测结果 &nbsp;<span id="resultRunId" style="font-weight:400;font-size:11px;color:var(--text3)"></span></div>
      <div class="metrics-grid" id="metricsGrid">
        <div class="metric">
          <div class="val" id="mEquity">-</div>
          <div class="lbl">期末净值</div>
        </div>
        <div class="metric">
          <div class="val" id="mReturn">-</div>
          <div class="lbl">总收益</div>
        </div>
        <div class="metric">
          <div class="val" id="mAnnual">-</div>
          <div class="lbl">年化收益</div>
        </div>
        <div class="metric">
          <div class="val" id="mSharpe">-</div>
          <div class="lbl">Sharpe</div>
        </div>
        <div class="metric">
          <div class="val" id="mDD" style="font-size:16px;">-</div>
          <div class="lbl">最大回撤</div>
        </div>
        <div class="metric">
          <div class="val" id="mStatus" style="font-size:14px;">-</div>
          <div class="lbl">状态</div>
        </div>
      </div>
    </div>

    <!-- 净值曲线 -->
    <div class="card" id="equityCard" style="display:none;">
      <div class="card-header"><div class="dot"></div>净值曲线 vs 买入持有</div>
      <div class="card-body">
        <div style="height:260px;">
          <canvas id="equityChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 参数扫描结果 -->
    <div class="card" id="scanCard" style="display:none;">
      <div class="card-header"><div class="dot"></div>参数扫描结果</div>
      <div class="card-body">
        <div id="scanResults" class="scan-results"></div>
      </div>
    </div>

    <!-- 历史回测记录 -->
    <div class="card">
      <div class="card-header"><div class="dot"></div>历史回测记录</div>
      <div class="card-body" style="padding:0;">
        <div style="max-height:320px;overflow-y:auto;">
          <table id="reportsTable">
            <thead>
              <tr>
                <th>时间</th>
                <th>策略</th>
                <th>标的</th>
                <th>总收益</th>
                <th>年化</th>
                <th>Sharpe</th>
                <th>最大回撤</th>
              </tr>
            </thead>
            <tbody id="reportsBody">
              <tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px;">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 荐股日历 -->
    <div class="card" id="picksCard">
      <div class="card-header">
        <div class="dot"></div>荐股日历
        <span id="picksCount" style="font-weight:400;font-size:11px;color:var(--text3);margin-left:8px;"></span>
      </div>
      <div class="card-body" style="padding:0;">
        <div id="picksCalendar" style="padding:12px;">
          <div style="color:var(--text3);font-size:12px;padding:8px;text-align:center;">加载中...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────
let currentSymbol = null;
let currentStrategy = 'trend_following';
let klineChart = null;
let equityChart = null;
let lastReport = null;

const STRATEGY_SCHEMA = {
  trend_following: [
    { name: 'short_window', label: '短期均线', type: 'int', default: 5, min: 2, max: 60, step: 1 },
    { name: 'long_window',  label: '长期均线',  type: 'int', default: 20, min: 5, max: 200, step: 5 },
  ],
  mean_reversion: [
    { name: 'lookback_window', label: '历史窗口', type: 'int', default: 20, min: 5, max: 200, step: 5 },
    { name: 'entry_zscore',   label: '入场阈值', type: 'float', default: 1.0, min: 0.5, max: 3.0, step: 0.1 },
    { name: 'exit_zscore',    label: '平仓阈值', type: 'float', default: 0.3, min: 0.1, max: 1.5, step: 0.05 },
  ],
};

const RISK_SCHEMA = [
  { name: 'commission_rate',      label: '佣金率',    type: 'float', default: 0.0003, min: 0.0,   max: 0.01,   step: 0.0001 },
  { name: 'slippage_rate',        label: '滑点率',    type: 'float', default: 0.0005, min: 0.0,   max: 0.01,   step: 0.0001 },
  { name: 'max_drawdown_ratio',   label: '回撤熔断',  type: 'float', default: 0.15,   min: 0.01,  max: 0.5,   step: 0.01 },
];

const PRESETS = {
  trend_following: [
    { label: '默认 (5/20)',  params: { short_window: 5,  long_window: 20 } },
    { label: '短线 (5/30)',  params: { short_window: 5,  long_window: 30 } },
    { label: '中线 (10/30)', params: { short_window: 10, long_window: 30 } },
    { label: '长线 (10/60)', params: { short_window: 10, long_window: 60 } },
  ],
  mean_reversion: [
    { label: '敏感 (0.8/0.2)', params: { lookback_window: 20, entry_zscore: 0.8, exit_zscore: 0.2 } },
    { label: '默认 (1.0/0.3)', params: { lookback_window: 20, entry_zscore: 1.0, exit_zscore: 0.3 } },
    { label: '保守 (1.5/0.5)', params: { lookback_window: 30, entry_zscore: 1.5, exit_zscore: 0.5 } },
  ],
};

// ─────────────────────────────────────────────────────────────────────────
// Utils
// ─────────────────────────────────────────────────────────────────────────
function setStatus(text, type = 'ready') {
  const badge = document.getElementById('statusBadge');
  badge.textContent = text;
  badge.className = 'badge' + (type === 'loading' ? '' : type === 'error' ? ' badge-red' : ' badge-green');
}

function fmtPct(v) {
  if (!v || v === 'N/A') return '—';
  try { return (parseFloat(v) * 100).toFixed(2) + '%'; } catch { return v; }
}

function fmtNum(v) {
  if (!v || v === 'N/A') return '—';
  try { return parseFloat(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}); } catch { return v; }
}

function fmtDate(ts) {
  if (!ts) return '—';
  return ts.replace('T', ' ').slice(0, 16);
}

// ─────────────────────────────────────────────────────────────────────────
// API calls
// ─────────────────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

// ─────────────────────────────────────────────────────────────────────────
// Symbol list
// ─────────────────────────────────────────────────────────────────────────
async function loadSymbols() {
  try {
    const symbols = await fetchJSON('/api/symbols');
    const container = document.getElementById('symbolList');
    if (!symbols.length) {
      container.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:8px;">暂无数据</div>';
      return;
    }
    container.innerHTML = symbols.map(s => `
      <div class="symbol-item${currentSymbol === s.symbol ? ' active' : ''}" data-symbol="${s.symbol}">
        <div>
          <div class="sym">${s.symbol}</div>
          <div class="info">${s.start_date} ~ ${s.end_date}</div>
        </div>
        <div class="rows">${s.rows}条</div>
      </div>
    `).join('');
    container.querySelectorAll('.symbol-item').forEach(el => {
      el.addEventListener('click', () => {
        currentSymbol = el.dataset.symbol;
        loadSymbols();
        loadTimeseries(currentSymbol);
        document.getElementById('chartTitle').textContent = currentSymbol + ' 日线';
      });
    });
    // 默认选第一个
    if (!currentSymbol && symbols.length) {
      currentSymbol = symbols[0].symbol;
      loadTimeseries(currentSymbol);
      document.getElementById('chartTitle').textContent = currentSymbol + ' 日线';
    }
  } catch(e) { console.error('loadSymbols', e); }
}

// ─────────────────────────────────────────────────────────────────────────
// K-line chart (TradingView Lightweight Charts)
// ─────────────────────────────────────────────────────────────────────────

async function loadTimeseries(symbol) {
  try {
    const data = await fetchJSON(`/api/timeseries/${encodeURIComponent(symbol)}`);
    if (!data.length) return;
    renderKline(data);
    document.getElementById('chartRange').textContent =
      data[0].timestamp.slice(0,10) + ' \u2192 ' + data[data.length-1].timestamp.slice(0,10);
  } catch(e) { console.error('loadTimeseries', e); }
}

function renderKline(bars) {
  // Destroy existing chart
  if (klineChart) { klineChart.remove(); klineChart = null; }

  const container = document.getElementById('klineChart');
  container.innerHTML = '';

  klineChart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: 360,
    layout: {
      background: { type: 'solid', color: '#1a1d27' },
      textColor: '#94a3b8',
      fontSize: 11,
    },
    grid: {
      vertLines: { color: 'rgba(42,45,62,0.6)' },
      horzLines: { color: 'rgba(42,45,62,0.6)' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#6366f1', labelBackgroundColor: '#6366f1' },
      horzLine: { color: '#6366f1', labelBackgroundColor: '#6366f1' },
    },
    rightPriceScale: { borderColor: '#2a2d3e', scaleMargins: { top: 0.1, bottom: 0.1 } },
    timeScale: { borderColor: '#2a2d3e', timeVisible: false, secondsVisible: false },
    handleScale: { mouseWheel: true, pinch: true },
    handleScroll: { mouseWheel: true, pressedMouseMove: true },
  });

  // Candlestick series
  const candleData = bars.map(b => ({
    time: b.timestamp.slice(0,10),
    open: b.open,
    high: b.high,
    low: b.low,
    close: b.close,
  }));
  const candleSeries = klineChart.addCandlestickSeries({
    upColor: '#10b981',
    downColor: '#ef4444',
    borderUpColor: '#10b981',
    borderDownColor: '#ef4444',
    wickUpColor: '#10b981',
    wickDownColor: '#ef4444',
  });
  candleSeries.setData(candleData);

  // Moving averages
  const closes = bars.map(b => b.close);
  const ma5  = calcMA(closes, 5);
  const ma20 = calcMA(closes, 20);
  const ma60 = calcMA(closes, 60);

  const ma5Series = klineChart.addLineSeries({
    color: '#6366f1',
    lineWidth: 1.5,
    priceLineVisible: false,
    lastValueVisible: false,
  });
  ma5Series.setData(ma5.map((v, i) => v == null ? null : { time: bars[i].timestamp.slice(0,10), value: v }));

  const ma20Series = klineChart.addLineSeries({
    color: '#22d3ee',
    lineWidth: 1.5,
    priceLineVisible: false,
    lastValueVisible: false,
  });
  ma20Series.setData(ma20.map((v, i) => v == null ? null : { time: bars[i].timestamp.slice(0,10), value: v }));

  const ma60Series = klineChart.addLineSeries({
    color: '#f59e0b',
    lineWidth: 1.5,
    priceLineVisible: false,
    lastValueVisible: false,
  });
  ma60Series.setData(ma60.map((v, i) => v == null ? null : { time: bars[i].timestamp.slice(0,10), value: v }));

  // Fit content
  klineChart.timeScale().fitContent();

  // Tooltip on crosshair move
  klineChart.subscribeCrosshairMove(param => {
    if (!param.time || !param.seriesData) return;
    const cd = param.seriesData.get(candleSeries);
    if (!cd) return;
    const pct = ((cd.close - cd.open) / cd.open * 100).toFixed(2);
    // could show tooltip here if needed
  });
}

function calcMA(closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    const slice = closes.slice(i - period + 1, i + 1);
    return slice.reduce((a, b) => a + b, 0) / period;
  });
}

window.addEventListener('resize', () => {

});

function renderParamPanel() {
  const container = document.getElementById('paramPanel');
  const schema = STRATEGY_SCHEMA[currentStrategy];
  container.innerHTML = schema.map(p => `
    <div class="param-group">
      <label>${p.label}</label>
      <div class="param-row">
        <input type="range"
          id="range_${p.name}"
          min="${p.min}" max="${p.max}" step="${p.step}"
          value="${p.default}"
          oninput="onSlider('${p.name}', this.value)">
        <input type="number"
          id="num_${p.name}"
          min="${p.min}" max="${p.max}" step="${p.step}"
          value="${p.default}"
          style="width:65px"
          onchange="onNum('${p.name}', this.value)">
      </div>
    </div>
  `).join('');
  // 也渲染风控参数
  renderRiskPanel();
  renderPresets();
}

function onSlider(name, val) {
  document.getElementById('num_' + name).value = val;
}
function onNum(name, val) {
  document.getElementById('range_' + name).value = val;
}

function renderRiskPanel() {
  const container = document.getElementById('riskParams');
  container.innerHTML = RISK_SCHEMA.map(p => {
    const displayVal = p.type === 'float' ? parseFloat(p.default).toFixed(4) : p.default;
    return `
    <div class="param-row">
      <label>${p.label}</label>
      <input type="range"
        id="risk_range_${p.name}"
        min="${p.min}" max="${p.max}" step="${p.step}"
        value="${p.default}"
        oninput="onRiskSlider('${p.name}', this.value)">
      <span class="param-value" id="risk_val_${p.name}">${displayVal}</span>
    </div>
  `}).join('');
}

function onRiskSlider(name, val) {
  const p = RISK_SCHEMA.find(x => x.name === name);
  const display = p.type === 'float' ? parseFloat(val).toFixed(4) : val;
  document.getElementById('risk_val_' + name).textContent = display;
}

function renderPresets() {
  const container = document.getElementById('presets');
  const presets = PRESETS[currentStrategy] || [];
  container.innerHTML = presets.map((p, i) => `
    <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px;"
      onclick="applyPreset(${JSON.stringify(p.params).replace(/"/g, '&quot;')})">
      ${p.label}
    </button>
  `).join('');
}

function applyPreset(params) {
  for (const [k, v] of Object.entries(params)) {
    const schema = [...(STRATEGY_SCHEMA[currentStrategy] || [])];
    const p = schema.find(x => x.name === k);
    if (!p) continue;
    const display = p.type === 'float' ? v.toFixed ? v.toFixed(2) : v : v;
    document.getElementById('range_' + k).value = v;
    document.getElementById('num_' + k).value = v;
  }
}

function getStrategyParams() {
  const schema = STRATEGY_SCHEMA[currentStrategy];
  const params = {};
  schema.forEach(p => {
    const el = document.getElementById('num_' + p.name);
    if (el) params[p.name] = p.type === 'int' ? parseInt(el.value) : parseFloat(el.value);
  });
  return params;
}

function getRiskParams() {
  const params = {};
  RISK_SCHEMA.forEach(p => {
    const el = document.getElementById('risk_range_' + p.name);
    if (el) params[p.name] = p.type === 'float' ? parseFloat(el.value) : parseFloat(el.value);
  });
  return params;
}

document.getElementById('btnRun').addEventListener('click', async () => {
  if (!currentSymbol) { alert('请先选择标的'); return; }
  const btn = document.getElementById('btnRun');
  const alertEl = document.getElementById('runAlert');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 运行中...';
  setStatus('回测中...', 'loading');

  try {
    const result = await postJSON('/api/backtest', {
      symbol: currentSymbol,
      strategy: currentStrategy,
      params: getStrategyParams(),
      risk_params: getRiskParams(),
    });

    if (result.stderr && result.stderr.includes('Error')) {
      alertEl.innerHTML = `<div class="alert alert-error">运行出错: ${result.stderr.slice(0,200)}</div>`;
      setStatus('失败', 'error');
    } else {
      alertEl.innerHTML = '';
      lastReport = result.report;
      if (lastReport) renderResults(lastReport);
      loadReports();
      setStatus('完成', 'ready');
    }
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">请求失败: ${e.message}</div>`;
    setStatus('错误', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ 运行回测';
  }
});

async function loadReports() {
  try {
    const reports = await fetchJSON('/api/reports');
    const tbody = document.getElementById('reportsBody');
    if (!reports.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px;">暂无记录</td></tr>';
      return;
    }
    tbody.innerHTML = reports.slice(0, 50).map(r => {
      const tagClass = r.strategy === 'trend_following' ? 'tf' : 'mr';
      const sharpe = parseFloat(r.sharpe_ratio || 0);
      return `
        <tr onclick="loadReportDetail('${r.run_id}')" style="cursor:pointer">
          <td><span class="mono">${fmtDate(r.created_at)}</span></td>
          <td><span class="tag ${tagClass}">${r.strategy === 'trend_following' ? '趋势' : '均值'}</span></td>
          <td>${r.symbol}</td>
          <td class="mono" style="color:${parseFloat(r.total_return||0)>=0?'var(--green)':'var(--red)'}">${fmtPct(r.total_return)}</td>
          <td class="mono">${fmtPct(r.annualized_return)}</td>
          <td class="mono sharpe ${sharpe>=1?'high':sharpe<0?'low':''}">${r.sharpe_ratio||'—'}</td>
          <td class="mono" style="color:var(--red)">${fmtPct(r.max_drawdown)}</td>
        </tr>
      `;
    }).join('');
  } catch(e) { console.error('loadReports', e); }
}

async function loadReportDetail(runId) {
  try {
    const data = await fetchJSON('/api/report/' + encodeURIComponent(runId));
    if (!data) return;
    const summary = data.summary || {};
    renderResults({
      run_id: runId,
      final_equity: summary.final_equity,
      total_return: summary.total_return,
      annualized_return: summary.annualized_return,
      max_drawdown: summary.max_drawdown,
      sharpe_ratio: summary.sharpe_ratio,
      status: summary.status,
    });
  } catch(e) { console.error('loadReportDetail', e); }
}

  try {

      symbol: currentSymbol,

    return `
      <div class="scan-card${i===0?' best':''}" onclick="loadReportDetail('${r.run_id}')">

          <div class="m"><span class="v ${ret>=0?'g':'r'}" style="color:var(--${ret>=0?'green':'red'})">${fmtPct(r.total_return)}</span> <span style="color:var(--text3)">收益</span></div>
          <div class="m"><span class="v">${sharpe.toFixed(2)}</span> <span style="color:var(--text3)">Sharpe</span></div>
          <div class="m"><span class="v" style="color:var(--red)">${fmtPct(r.max_drawdown)}</span> <span style="color:var(--text3)">回撤</span></div>
        </div>
        ${i===0?'<div style="font-size:10px;color:var(--green);margin-top:4px">★ 最优</div>':''}

  }).join('');
}

async function loadPicksCalendar() {
  try {
    const resp = await fetchJSON('/api/picks?days=90');
    const picks = resp.picks || [];
    document.getElementById('picksCount').textContent = `${picks.length} 条记录`;
    renderPicksCalendar(picks);
  } catch(e) {
    document.getElementById('picksCalendar').innerHTML =
      '<div style="color:var(--text3);font-size:12px;padding:8px;">加载失败: ' + e.message + '</div>';
  }
}

function renderPicksCalendar(picks) {
  const container = document.getElementById('picksCalendar');
  if (!picks.length) {
    container.innerHTML = '<div style="color:var(--text3);font-size:12px;text-align:center;padding:16px;">暂无荐股记录</div>';
    return;
  }

  // 按 push_date 分组
  const byDate = {};
  picks.forEach(p => {
    const d = p.push_date;
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(p);
  });

  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
  let html = '';

  dates.forEach(date => {
    const dayPicks = byDate[date];
    html += `<div class="picks-day">`;
    html += `<div class="picks-date">${formatDateLabel(date)}</div>`;
    html += `<div class="picks-items">`;
    dayPicks.forEach(p => {
      const entry = p.entry_price ? p.entry_price.toFixed(2) : '-';
      const sl = p.stop_loss ? p.stop_loss.toFixed(2) : '-';
      const tp = p.take_profit ? p.take_profit.toFixed(2) : '-';
      const ret = p.final_return;
      const maxR = p.max_return;

      let retColor = 'var(--text3)';
      let retText = '-';
      let statusIcon = '⏳';
      if (ret !== null && ret !== undefined) {
        retText = (ret >= 0 ? '+' : '') + ret.toFixed(2) + '%';
        retColor = ret >= 0 ? 'var(--green)' : 'var(--red)';
        if (p.status === 'hit_profit') statusIcon = '✅';
        else if (p.status === 'hit_stop') statusIcon = '❌';
        else statusIcon = '⏳';
      } else if (p.tracking_days > 0) {
        retText = `追踪${p.tracking_days}天`;
      }

      const scoreColor = p.score >= 80 ? 'var(--green)' : p.score >= 70 ? 'var(--accent2)' : 'var(--text3)';

      html += `
        <div class="picks-item">
          <div class="picks-item-header">
            <span class="picks-name">${statusIcon} ${p.code} ${p.name}</span>
            <span class="picks-score" style="color:${scoreColor}">${p.score}</span>
          </div>
          <div class="picks-item-detail">
            <span>入场${entry}</span>
            <span style="color:var(--red)">损${sl}</span>
            <span style="color:var(--green)">盈${tp}</span>
          </div>
          <div class="picks-item-returns">
            <span style="color:${retColor}">${retText}</span>
            ${maxR !== null && maxR > 0 ? `<span style="color:var(--accent2);font-size:10px;"> 最高+${maxR.toFixed(1)}%</span>` : ''}
            <span style="color:var(--text3);font-size:10px;"> ${p.reason || ''}</span>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function formatDateLabel(dateStr) {
  // dateStr format: YYYY-MM-DD
  const d = new Date(dateStr);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if (dateStr === formatDate(today)) return '📅 今日';
  if (dateStr === formatDate(yesterday)) return '🗓 昨日';
  return '📅 ' + dateStr;
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
