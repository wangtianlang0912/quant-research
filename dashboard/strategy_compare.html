<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略对比面板 | Quant Research</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#0d1117; color:#c9d1d9; padding:24px; }
h1 { font-size:22px; margin-bottom:20px; color:#f0f6fc; }
h1 span { color:#58a6ff; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
.card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:20px; }
.card h2 { font-size:16px; color:#f0f6fc; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid #30363d; }
.card.factor h2 { border-color:#238636; color:#3fb950; }
.card.breakout h2 { border-color:#1f6feb; color:#58a6ff; }

.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.kpi { background:#0d1117; border-radius:6px; padding:12px; text-align:center; }
.kpi .val { font-size:26px; font-weight:bold; }
.kpi .lbl { font-size:12px; color:#8b949e; margin-top:4px; }
.kpi.win .val { color:#3fb950; }
.kpi.loss .val { color:#f85149; }
.kpi.avg .val { color:#d2991d; }

.chart-wrap { height:240px; position:relative; margin-bottom:16px; }

.table-wrap { max-height:360px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:8px 10px; color:#8b949e; font-weight:500; border-bottom:2px solid #30363d; position:sticky; top:0; background:#161b22; }
td { padding:6px 10px; border-bottom:1px solid #21262d; }
th:last-child, td:last-child { text-align:right; }
.ret-plus { color:#3fb950; }
.ret-neg  { color:#f85149; }

.summary-bar { display:flex; gap:24px; padding:16px; background:#161b22; border:1px solid #30363d; border-radius:8px; margin-top:20px; }
.summary-item { display:flex; align-items:center; gap:8px; }
.summary-item .dot { width:10px; height:10px; border-radius:50%; }
.dot.g { background:#3fb950; }
.dot.r { background:#f85149; }
.dot.y { background:#d2991d; }

.refresh { color:#8b949e; font-size:12px; margin-top:8px; }
</style>
</head>
<body>

<h1>📊 策略收益对比 <span id="update-time"></span></h1>

<div class="grid" id="cards"></div>

<div class="summary-bar" id="summary"></div>
<div class="refresh">数据来源: reports/push_log.json | 止盈止损: -6%/+15%</div>

<script>
// ——— 数据注入 ———
const DATA = {"factor": {"total": 47, "hit_profit": 6, "hit_stop": 16, "pending": 12, "expired": 13, "win_rate": 27.3, "avg_return": 0.22, "max_return": 19.62, "min_return": -14.73, "timeline": [{"date": "2026-05-07", "cum": 13.3, "ret": 13.3, "status": "hit_profit"}, {"date": "2026-05-12", "cum": -1.43, "ret": -14.73, "status": "hit_stop"}, {"date": "2026-05-13", "cum": -4.72, "ret": -3.29, "status": "hit_stop"}, {"date": "2026-05-14", "cum": -11.08, "ret": -6.36, "status": "hit_stop"}, {"date": "2026-05-15", "cum": -15.55, "ret": -4.47, "status": "hit_stop"}, {"date": "2026-05-19", "cum": -20.9, "ret": -5.34, "status": "hit_stop"}, {"date": "2026-05-20", "cum": -25.83, "ret": -4.93, "status": "hit_stop"}, {"date": "2026-05-20", "cum": -12.07, "ret": 13.76, "status": "hit_profit"}, {"date": "2026-05-22", "cum": -17.17, "ret": -5.09, "status": "hit_stop"}, {"date": "2026-05-28", "cum": -20.74, "ret": -3.58, "status": "hit_stop"}, {"date": "2026-05-29", "cum": -26.87, "ret": -6.12, "status": "hit_stop"}, {"date": "2026-05-29", "cum": -33.35, "ret": -6.48, "status": "hit_stop"}, {"date": "2026-06-15", "cum": -36.8, "ret": -3.45, "status": "hit_stop"}, {"date": "2026-06-16", "cum": -23.73, "ret": 13.07, "status": "hit_profit"}, {"date": "2026-06-17", "cum": -4.1, "ret": 19.62, "status": "hit_profit"}, {"date": "2026-06-17", "cum": -7.27, "ret": -3.17, "status": "hit_stop"}, {"date": "2026-06-18", "cum": 9.68, "ret": 16.95, "status": "hit_profit"}, {"date": "2026-06-18", "cum": 5.19, "ret": -4.49, "status": "hit_stop"}, {"date": "2026-06-19", "cum": 22.15, "ret": 16.95, "status": "hit_profit"}, {"date": "2026-06-22", "cum": 12.72, "ret": -9.43, "status": "hit_stop"}, {"date": "2026-06-22", "cum": 9.0, "ret": -3.72, "status": "hit_stop"}, {"date": "2026-06-24", "cum": 4.75, "ret": -4.25, "status": "hit_stop"}], "recent10": [{"code": "603995", "name": "甬金股份", "date": "2026-06-19", "ret": 8.6, "status": "pending"}, {"code": "603588", "name": "高能环境", "date": "2026-06-19", "ret": 16.95, "status": "hit_profit"}, {"code": "600711", "name": "盛屯矿业", "date": "2026-06-22", "ret": -9.43, "status": "hit_stop"}, {"code": "300146", "name": "汤臣倍健", "date": "2026-06-22", "ret": -3.72, "status": "hit_stop"}, {"code": "000612", "name": "焦作万方", "date": "2026-06-24", "ret": -4.25, "status": "hit_stop"}, {"code": "600352", "name": "浙江龙盛", "date": "2026-06-24", "ret": 7.29, "status": "pending"}, {"code": "300041", "name": "回天新材", "date": "2026-06-25", "ret": 0.01, "status": "pending"}, {"code": "600459", "name": "贵研铂业", "date": "2026-06-25", "ret": 9.94, "status": "pending"}, {"code": "301345", "name": "涛涛车业", "date": "2026-06-26", "ret": 0.35, "status": "pending"}, {"code": "688093", "name": "世华科技", "date": "2026-06-26", "ret": 4.23, "status": "pending"}]}, "breakout": {"total": 10, "hit_profit": 0, "hit_stop": 0, "pending": 10, "expired": 0, "win_rate": 0, "avg_return": 0, "max_return": 0, "min_return": 0, "timeline": [], "recent10": [{"code": "688498", "name": "源杰科技", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "601869", "name": "长飞光纤", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "300903", "name": "科翔股份", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "688519", "name": "南亚新材", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "600487", "name": "亨通光电", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "603256", "name": "宏和科技", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "600869", "name": "远东股份", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "603618", "name": "杭电股份", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "600396", "name": "华电辽能", "date": "2026-06-30", "ret": 0.0, "status": "pending"}, {"code": "688777", "name": "中控技术", "date": "2026-06-30", "ret": 0.0, "status": "pending"}]}};

function build() {
    const strategies = [
        { key:'factor', label:'多因子扫描', cls:'factor', color:'#3fb950', data:DATA.factor },
        { key:'breakout', label:'突破形态 (Qullamaggie)', cls:'breakout', color:'#58a6ff', data:DATA.breakout },
    ];
    
    let cardsHTML = '';
    strategies.forEach(s => {
        const d = s.data;
        cardsHTML += `
        <div class="card ${s.cls}">
            <h2>🔹 ${s.label}  总推送 ${d.total}</h2>
            <div class="kpis">
                <div class="kpi win"><div class="val">${d.win_rate}%</div><div class="lbl">胜率 (${d.hit_profit}/${d.hit_profit+d.hit_stop})</div></div>
                <div class="kpi avg"><div class="val">${d.avg_return>=0?'+':''}${d.avg_return.toFixed(2)}%</div><div class="lbl">已完成均收益</div></div>
                <div class="kpi"><div class="val">${d.pending}</div><div class="lbl">待追踪</div></div>
            </div>
            <div class="kpis">
                <div class="kpi win"><div class="val">${d.hit_profit}</div><div class="lbl">✅ 止盈</div></div>
                <div class="kpi loss"><div class="val">${d.hit_stop}</div><div class="lbl">❌ 止损</div></div>
                <div class="kpi" style="color:#8b949e"><div class="val">${d.expired}</div><div class="lbl">⏰ 过期</div></div>
            </div>
            <div class="chart-wrap">
                <canvas id="chart-${s.key}"></canvas>
            </div>
            ${d.timeline.length > 0 ? '' : '<div style="text-align:center;color:#484f58;padding:40px">暂无已结束交易</div>'}
            <div class="table-wrap">
                <table>
                    <thead><tr><th>代码</th><th>名称</th><th>日期</th><th>状态</th><th>收益</th></tr></thead>
                    <tbody>
                        ${d.recent10.map(r => `
                        <tr>
                            <td>${r.code}</td>
                            <td>${r.name}</td>
                            <td>${r.date}</td>
                            <td>${r.status==='hit_profit'?'✅':'❌'}</td>
                            <td class="${r.ret>=0?'ret-plus':'ret-neg'}">${r.ret>=0?'+':''}${r.ret.toFixed(2)}%</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    });
    
    document.getElementById('cards').innerHTML = cardsHTML;
    document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
    
    // 汇总
    document.getElementById('summary').innerHTML = `
        <div class="summary-item"><div class="dot g"></div><span>因子扫描 胜率 ${DATA.factor.win_rate}%，均收益 ${DATA.factor.avg_return>=0?'+':''}${DATA.factor.avg_return.toFixed(2)}%</span></div>
        <div class="summary-item"><div class="dot y"></div><span>突破形态 暂无完成交易（10只待追踪，2026-06-30入库）</span></div>
    `;
    
    // 画图
    strategies.forEach(s => {
        if (s.data.timeline.length === 0) return;
        const ctx = document.getElementById(`chart-${s.key}`);
        if (!ctx) return;
        
        const labels = s.data.timeline.map(t => t.date);
        const cumData = s.data.timeline.map(t => t.cum);
        // 颜色：止盈绿点、止损红点
        const pointColors = s.data.timeline.map(t => t.status==='hit_profit' ? '#3fb950' : '#f85149');
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: '累计收益 (%)',
                    data: cumData,
                    borderColor: s.color,
                    backgroundColor: s.color + '20',
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: pointColors,
                    pointBorderColor: pointColors,
                    pointRadius: 3,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#484f58', font: { size:10 } }, grid: { display:false } },
                    y: { ticks: { color: '#484f58', font: { size:10 }, callback: v => v+'%' }, grid: { color:'#21262d' } }
                }
            }
        });
    });
}

window.onload = build;
</script>
</body>
</html>
