[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quant-research"
version = "2.0.0"
description = "个人级可解释投研助手（quant_research_v2）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }

# ★ 依赖极简：v2 是单人维护项目，每加一个依赖都是长期维护债。
#   领域层（domain/）零第三方依赖，只有 pydantic 用于数据契约。
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # ★ 唯一进入运行时的第三方存储依赖：Parquet 列存（adapters/persistence 专用）。
    #   领域层（domain/）依旧零第三方依赖 —— ARCH010 import 方向守卫保证它不会渗入。
    "pyarrow>=16",
    # CLI：typer 用类型注解生成命令（架构选型 §3），rich 让门禁报告可读。
    #   只允许 cli/ 与 ops/ 使用 —— 不进入 domain/（ARCH010 禁入清单）。
    "typer>=0.12",
    "rich>=13.7",
    # ★ baostock：A 股主源（唯一同时给 backAdjustFactor / 退市股历史 / PIT 快照的源）。
    #   只允许在 adapters/market_data/subprocess_worker.py 与 baostock_cn.py import
    #   （ARCH014：裸 TCP 不认代理 + C 扩展会挂死，主进程绝不持有其会话）。
    "baostock>=0.8",
    "akshare>=1.14",
]

[project.scripts]
qv2 = "quant_v2.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "coverage>=7.5",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_v2"]

[tool.hatch.build.targets.sdist]
include = ["src/quant_v2", "configs", "tests", "tools", "README.md"]

[tool.uv]
# uv sync 时以 editable 方式安装本项目，使 `import quant_v2` 可用
package = true

# ============================================================
# ruff —— lint + format 的唯一真源
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["docs", "var", "web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff 特有规则
    "S",   # bandit（安全）；对测试目录豁免 S101
]
ignore = [
    "PLR0913",  # 构造参数多：领域对象字段天然较多，强行拆散反而难读

    # ★ RUF001/002/003「歧义 Unicode 字符」—— 本项目的文档字符串与注释是中文，
    #   全角标点（，。：（））会被逐字符判为"疑似 ASCII 同形字符"。
    #   实测这三规则贡献了 2047 / 2170 条告警（94%），全是误报。
    #   一条规则若 94% 是噪音，工程师会学会无视它的输出 —— 那它还不如关掉。
    "RUF001",
    "RUF002",
    "RUF003",

    # ★ UP042 建议把 `class X(str, Enum)` 换成 `StrEnum`。
    #   不换：3.11/3.12 下 mixin enum 的 __str__/__format__ 行为变过两次，
    #   而本项目大量把枚举值推进 JSON / 飞书卡片 / SQLite，
    #   序列化口径必须稳定可预期。统一用 `.value` 取值，不依赖隐式 str()。
    "UP042",
]

# ★ 自定义 noqa 规则码（tools/arch_lint 的 ARCH001~015）。
#   不声明的话 ruff 会把 `# noqa: ARCH001` 判为 RUF102 无效规则码，
#   而行内豁免正是架构门禁的"例外出口"，不能被 linter 二次卡住。
external = [
    "ARCH001", "ARCH002", "ARCH003", "ARCH004", "ARCH005", "ARCH006",
    "ARCH007", "ARCH008", "ARCH009", "ARCH010", "ARCH011", "ARCH012",
    "ARCH013", "ARCH014", "ARCH015",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "PLR2004", "PLR0915", "ARG001", "ARG002",
    # ★ 测试函数名放宽 N802 / PLC2401：pytest 输出就是文档，
    #   中文命名（"test_三视图两两比值恒定"）的可读性高于 ASCII 强制约束；
    #   生产代码 (src/ tools/) 仍受这两条规则约束。
    "N802", "PLC2401",
]
"tools/arch_lint/**" = ["S101", "PLR2004", "ARG001"]
# ★ CLI：typer 的声明式参数就长这样（typer.Option 在默认值位置），
#   这是框架惯用法而非 bug；B008 针对的是"默认值里有隐藏副作用调用"。
"src/quant_v2/cli/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["quant_v2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy —— strict 覆盖核心域（§8.4）
# ============================================================
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = [
    "src/quant_v2/domain",
    "src/quant_v2/indicators",
]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true

# adapters 依赖第三方 SDK，缺类型存根；T02 接入 akshare/pandas 后在此放宽
[[tool.mypy.overrides]]
module = ["quant_v2.adapters.*"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*", "tools.*"]
ignore_missing_imports = true

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: 单元测试（纯逻辑，无 I/O）",
    "architecture: 架构守卫测试，对应 ARCH001~015 不变量",
    "regression: v1 实证缺陷的回归测试，删除即 CI 失败",
    "golden: 对照独立参考实现的数值 golden 测试",
    "integration: 跨模块集成测试",
    "e2e: 端到端冒烟",
]
filterwarnings = ["error"]

# ============================================================
# coverage —— 双阈值（整体 ≥60%，核心域 ≥85%）
#   整体阈值写在 report.fail_under；核心域阈值由 `make coverage` 二次判定
# ============================================================
[tool.coverage.run]
branch = true
source = ["src/quant_v2", "tools"]
omit = ["*/__main__.py"]

[tool.coverage.paths]
source = ["src/quant_v2", "*/src/quant_v2"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

# 整体阈值；核心域阈值见 Makefile 的 `make coverage`
fail_under = 60
